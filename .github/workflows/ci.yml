name: Foundation security and quality

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      FIREBASE_CLI_DISABLE_TELEMETRY: '1'
      FIREBASE_PROJECT_ID: demo-social-foundation
      EXPO_PUBLIC_APP_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Java for Firebase emulators
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Scan repository before installing dependencies
        run: node scripts/scan-secrets.mjs
      - name: Reproducible install
        run: npm ci
      - name: Formatting, lint, strict types, tests, build and security
        run: npm run check
      - name: Expo dependency compatibility
        working-directory: apps/mobile
        run: npx expo install --check
      - name: Export Android and iOS JavaScript bundles
        run: npm run build:mobile
